<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181512" />
      <stop offset="100%" stop-color="#0e0c0a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97736" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Shield / Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#3a2f26" stroke-width="1.5" />

  <!-- Subtle Inner Grid / Matrix Accent -->
  <circle cx="32" cy="32" r="22" stroke="url(#accentGrad)" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Futuristic Monogram T with Terminal Glow -->
  <!-- Top Horizontal Bar -->
  <path d="M16 19 C16 17.5 17.5 16 19 16 L45 16 C46.5 16 48 17.5 48 19 L48 23 C48 24 47 25 46 25 L35 25 L35 46 C35 47.5 33.5 49 32 49 L30 49 C28.5 49 27 47.5 27 46 L27 25 L18 25 C17 25 16 24 16 23 Z" 
        fill="url(#accentGrad)" 
        filter="url(#glow)" />

  <!-- Sleek Tech Dot Accent / Pulse Indicator -->
  <circle cx="45" cy="45" r="3.5" fill="#10b981" stroke="#0e0c0a" stroke-width="1" />
</svg>
